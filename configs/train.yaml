seed: 0

# "auto" picks cuda > mps > cpu depending on what's available on the machine
# running this script. Set explicitly (e.g. "cuda") to force a device, which
# MetaCentrum jobs should do so a misconfigured node fails loudly instead of
# silently falling back to cpu.
device: auto

model:
  # 32-64-128-256 channel progression. Was 16, which measurably saturated: at
  # base_channels 16 the overfit check could memorize 3 instances to IoU 1.0000
  # but stalled at ~0.91 on 4. At 32 all 4 reach 1.0000 by epoch 500. If the
  # model cannot memorize 4 examples it is far too small for ~700k instances.
  base_channels: 32

data:
  image_size: 128 # must be divisible by 8 for this depth-3 UNet

overfit:
  subset_size: 4
  # lr 0.003 reached IoU ~0.90 and then destabilized deterministically around
  # epoch 587. At 0.001 a single instance memorizes to IoU 1.0000 / loss 0.0015,
  # which is what this sanity check is actually meant to demonstrate.
  epochs: 2000
  lr: 0.001
  log_every: 100

# M4: real training on the full dataset.
training:
  # Splits are by image, not instance, to avoid leaking scenes between sets.
  splits: [0.7, 0.2, 0.1] # train / val / test
  split_seed: 0
  epochs: 40
  # Larger batches mean fewer Python-side iterations and better GPU
  # utilisation. At 128px with base_channels 32 this is nowhere near filling
  # an A40's memory.
  batch_size: 64
  lr: 0.001
  num_workers: 16 # match ncpus in scripts/metacentrum/train.pbs; loading is the bottleneck
  history_path: outputs/history.json

checkpoint:
  dir: outputs/checkpoints
  save_every: 200 # epochs
