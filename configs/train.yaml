seed: 0

# "auto" picks cuda > mps > cpu depending on what's available on the machine
# running this script. Set explicitly (e.g. "cuda") to force a device, which
# MetaCentrum jobs should do so a misconfigured node fails loudly instead of
# silently falling back to cpu.
device: auto

model:
  # "unet" (from scratch) or "resnet34_unet" (ImageNet-pretrained encoder).
  # Three controlled from-scratch experiments each moved test IoU by <= ~0.01
  # (data x3.3: +0.005; more epochs: 0; 12x resolution + depth + neighbour
  # clicks: +0.009), while every published 0.8+ method starts pretrained.
  # This switch is the literature's main lever. Input must divide by 32.
  arch: resnet34_unet
  pretrained: true
  # --- settings below apply to arch: unet only ---
  # Was 16, which measurably saturated: at base_channels 16 the overfit check
  # could memorize 3 instances to IoU 1.0000 but stalled at ~0.91 on 4. At 32
  # all 4 reach 1.0000 by epoch 500.
  base_channels: 32
  # Downsampling stages (the last is the bottleneck). Input must divide by
  # 2**depth.
  depth: 4

data:
  # (height, width). Was 128 square, which both starved boundaries of pixels
  # and squashed 4:3 photos into squares. 384x512 preserves the typical ADE20K
  # aspect ratio; both divide by 16 as depth-4 requires.
  image_size: [384, 512]

overfit:
  subset_size: 4
  # lr 0.003 reached IoU ~0.90 and then destabilized deterministically around
  # epoch 587. At 0.001 a single instance memorizes to IoU 1.0000 / loss 0.0015,
  # which is what this sanity check is actually meant to demonstrate.
  epochs: 2000
  lr: 0.001
  log_every: 100

# M4: real training on the full dataset.
training:
  # Splits are by image, not instance, to avoid leaking scenes between sets.
  splits: [0.7, 0.2, 0.1] # train / val / test
  split_seed: 0
  # A ceiling, not a target: early stopping ends the run once validation stops
  # improving. One 12h job will not reach 200 epochs, so long runs chain across
  # jobs via --auto-resume.
  epochs: 200
  # 384x512 input is ~12x the pixels of 128 square, so the batch comes down
  # accordingly. The PBS job requests gpu_mem to avoid landing on a 16GB card.
  batch_size: 32
  # Fine-tuning a pretrained encoder wants a gentler rate than training from
  # scratch (0.001 would trample the ImageNet features before the click
  # channels learn anything). ReduceLROnPlateau adjusts from here.
  lr: 0.0003
  # Cap on how many images to use. Our own ablation showed tripling the data
  # moved test IoU by +0.0045, so training on the 3000-image subset at high
  # resolution is a measured trade, not a guess. Set null to use everything.
  max_images: 3000
  lr_decay_factor: 0.5 # multiply lr by this when validation IoU plateaus
  lr_decay_patience: 8 # epochs without improvement before decaying
  early_stopping_patience: 30 # epochs without improvement before stopping entirely
  num_workers: 16 # match ncpus in scripts/metacentrum/train.pbs; loading is the bottleneck
  history_path: outputs/history.json

checkpoint:
  dir: outputs/checkpoints
  save_every: 200 # epochs
